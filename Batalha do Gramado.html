<style>
/* Layout: canvas 3D em tela cheia; #ui em cima com HUD no topo, joystick embaixo à esquerda, botões embaixo à direita; modais no centro. */
:root{
  --sky:#6ec6ff; --leaf:#4fcf3a; --sun:#ffd23f; --plum:#7b3fe4; --ink:#171028;
  --hero:#2fd46b; --villain:#a24bff; --danger:#ff4d5e; --panel:rgba(23,16,40,.94);
  --f-display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,sans-serif;
  --joy:clamp(120px,30vmin,170px); --bj:clamp(84px,19vmin,112px); --ba:clamp(70px,16vmin,92px); --bs:clamp(60px,14vmin,80px);
}
html,body{height:100%}
body{background:#120b22;color:#fff;font-family:var(--f-body);font-weight:800;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#7fd0ff}
#c{display:block;width:100%;height:100%;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}
.hudL,.hudR{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.hudR{justify-content:flex-end}
.hp{display:flex;align-items:center;gap:6px}
.heart{font-size:22px;color:var(--danger);text-shadow:0 2px 0 #000}
.bar{position:relative;width:clamp(120px,26vw,190px);height:22px;border-radius:12px;background:#2a1d44;border:3px solid #0d0818;overflow:hidden}
.bar i{position:absolute;inset:0;width:100%;background:linear-gradient(#6dff8f,#25c25a);transition:width .15s}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;text-shadow:0 1px 0 #000;font-variant-numeric:tabular-nums}
.pill{display:flex;align-items:baseline;gap:4px;padding:3px 10px;border-radius:14px;background:rgba(18,11,34,.82);border:3px solid #0d0818;font-variant-numeric:tabular-nums}
.pill .ic{font-size:17px}.pill b{font-family:var(--f-display);font-size:19px;font-weight:400}.pill small{opacity:.65;font-size:11px}
.pill.coin b{color:#ffd23f}.pill.gem b{color:#6de6ff}
#mission{padding:5px 10px;border-radius:12px;background:rgba(18,11,34,.82);border:3px solid #0d0818;font-size:12px;max-width:min(48vw,230px)}
#mission .mt{display:block;font-family:var(--f-display);font-weight:400;color:var(--sun);letter-spacing:.08em;font-size:11px}
.mbar{height:6px;border-radius:4px;background:#2a1d44;margin-top:3px;overflow:hidden}.mbar i{display:block;height:100%;width:0;background:var(--sun)}
#battleBar{display:flex;gap:6px;align-items:center;width:100%;justify-content:flex-end}
#score{padding:3px 10px;border-radius:12px;background:rgba(18,11,34,.82);border:3px solid #0d0818;font-family:var(--f-display);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
#score .h{color:var(--hero)}#score .v{color:#c993ff}
.sbtn{pointer-events:auto;font:inherit;font-family:var(--f-display);font-weight:400;font-size:14px;color:#fff;background:#d6334a;border:3px solid #0d0818;border-radius:12px;padding:4px 12px;cursor:pointer}
#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-10px);opacity:0;transition:.25s;font-family:var(--f-display);font-weight:400;font-size:clamp(18px,4.5vw,28px);text-shadow:0 3px 0 #000,0 0 14px #000;text-align:center;pointer-events:none;max-width:90%}
#toast.show{opacity:1;transform:translate(-50%,0)}
#hint{position:absolute;left:50%;bottom:calc(var(--bj) + var(--bs) + 92px);transform:translateX(-50%);font-size:12px;opacity:.85;text-shadow:0 1px 3px #000;text-align:center;pointer-events:none;transition:opacity 1s}
#bottom{position:relative;height:calc(var(--bj) + var(--bs) + 80px)}
#joy{position:absolute;left:0;bottom:8px;width:var(--joy);height:var(--joy);border-radius:50%;pointer-events:auto;touch-action:none;background:radial-gradient(circle at 50% 40%,rgba(210,230,245,.5),rgba(120,150,175,.5));border:5px solid rgba(235,245,255,.55);box-shadow:inset 0 0 18px rgba(0,0,0,.3)}
#joy::before{content:"";position:absolute;inset:22%;border-radius:50%;border:5px solid rgba(40,55,70,.5)}
#joy::after{content:"";position:absolute;inset:-30px}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9c9d6,#3d4d5c 70%);border:4px solid rgba(30,42,54,.85)}
.arw{position:absolute;width:0;height:0;border:7px solid transparent;opacity:.55}
.arw.u{top:4px;left:calc(50% - 7px);border-bottom-color:#2d3d4b}.arw.d{bottom:4px;left:calc(50% - 7px);border-top-color:#2d3d4b}
.arw.l{left:4px;top:calc(50% - 7px);border-right-color:#2d3d4b}.arw.r{right:4px;top:calc(50% - 7px);border-left-color:#2d3d4b}
#acts{position:absolute;inset:0;pointer-events:none}
.rb{position:absolute;pointer-events:auto;touch-action:none;border:0;border-radius:50%;color:#fff;font-family:var(--f-display);font-weight:400;cursor:pointer;display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.35),inset 0 3px 6px rgba(255,255,255,.45)}
.rb:active,.rb.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#btnJump{right:0;bottom:8px;width:var(--bj);height:var(--bj);background:radial-gradient(circle at 50% 30%,#ffb84a,#f08a14 70%);border:5px solid #ffe2a8;gap:0;align-content:center}
#btnJump svg{width:42%;height:42%;fill:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
#btnJump span{font-size:clamp(11px,2.6vmin,15px);text-shadow:0 2px 0 rgba(0,0,0,.35);margin-top:-4px}
#btnAtk{right:calc(var(--bj) + 12px);bottom:14px;width:var(--ba);height:var(--ba);font-size:calc(var(--ba)*.5);background:radial-gradient(circle at 50% 30%,#ff7a6b,#d6334a 72%);border:5px solid #ffc2b8}
#btnSuper{right:calc(var(--bj)*.45);bottom:calc(var(--bj) + 16px);width:var(--bs);height:var(--bs);padding:6px;background:conic-gradient(var(--sun) calc(var(--p,0)*1%),#3b3b46 0);box-sizing:border-box}
#btnSuper .in{position:relative;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font-size:calc(var(--bs)*.5);background:#77777f;filter:grayscale(1) brightness(.85)}
#btnSuper.ready .in{background:radial-gradient(circle at 50% 35%,#fffbd0,#ffd23f 55%,#ffa800);filter:none;box-shadow:0 0 28px 6px rgba(255,210,63,.9);animation:pulse .9s ease-in-out infinite}
#superSub{position:absolute;bottom:2px;font-size:12px;text-shadow:0 1px 2px #000}
#btnUse{right:0;bottom:calc(var(--bj) + var(--bs) + 34px);border-radius:16px;width:auto;height:auto;padding:8px 16px;font-size:16px;background:linear-gradient(#7be86a,#2fb34a);border:4px solid #d4ffc8;white-space:nowrap}
@keyframes pulse{50%{transform:scale(1.08)}}
#hurt{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 20px rgba(255,40,60,.7);opacity:0;transition:opacity .25s}
#hurt.show{opacity:1;transition:none}
#dead{position:absolute;inset:0;display:grid;place-items:center;background:rgba(40,0,10,.45);font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,56px);text-shadow:0 4px 0 #000;pointer-events:none}
.modal{position:absolute;inset:0;display:none;place-items:center;background:rgba(8,4,20,.72);z-index:20;pointer-events:auto}
.modal.open{display:grid}
.sheet{width:min(940px,calc(100% - 24px));max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--panel);border:4px solid var(--sun);border-radius:18px;overflow:hidden}
.sh-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:3px solid #0d0818;background:#241741;flex-wrap:wrap}
.sh-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--sun);flex:1;min-width:120px}
.tabs{display:flex;gap:6px}
.tab{font:inherit;font-family:var(--f-display);font-weight:400;font-size:15px;color:#fff;background:#3a2a5e;border:3px solid #0d0818;border-radius:12px;padding:4px 12px;cursor:pointer}
.tab.on.hero{background:var(--hero);color:#06240f}.tab.on.villain{background:var(--villain)}
.sh-note{padding:6px 14px;font-size:12px;opacity:.8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;overflow:auto;padding:12px 14px;touch-action:pan-y;min-height:0}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:14px;background:#2d2050;border:3px solid #0d0818;min-width:0;text-align:center}
.card.sel{border-color:var(--sun)}
.card canvas{border-radius:10px;max-width:100%}
.card h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:17px}
.card p{margin:0;font-size:11px;opacity:.8;font-weight:600;line-height:1.3}
.buy{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.cbtn{font:inherit;font-family:var(--f-display);font-weight:400;font-size:14px;color:#fff;border:3px solid #0d0818;border-radius:10px;padding:3px 10px;cursor:pointer;background:#2fb34a}
.cbtn.coin{background:#d49a14;color:#2b1c00}.cbtn.gem{background:#1ea7c9;color:#00222b}
.cbtn[disabled]{background:#4a4060;color:#9a90b5;cursor:not-allowed}
.owned{font-family:var(--f-display);font-weight:400;font-size:14px;color:#7dffa6}
.sh-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;border-top:3px solid #0d0818;background:#241741;font-size:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){#btnSuper.ready .in{animation:none}}
</style>

/* efeitos */
const fxList=[],particles=[],timers=[];
function schedule(t,fn){timers.push({t,fn});}
function addFx(life,obj,update,done){fxList.push({life,max:life,obj,update,done});if(obj)scene.add(obj);}
function updateFx(dt){
  for(let i=fxList.length-1;i>=0;i--){const x=fxList[i];x.life-=dt;const k=clamp(1-x.life/x.max,0,1);
    if(x.update)x.update(k,dt);
    if(x.life<=0){if(x.obj){scene.remove(x.obj);disposeObj(x.obj);}if(x.done)x.done();fxList.splice(i,1);}}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;
    p.vy-=14*dt;p.m.position.x+=p.vx*dt;p.m.position.y+=p.vy*dt;p.m.position.z+=p.vz*dt;
    const s=p.size*clamp(p.life/p.max,0,1);p.m.scale.set(s,s,s);
    if(p.life<=0){scene.remove(p.m);particles.splice(i,1);}}
  for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const f=timers[i].fn;timers.splice(i,1);f();}}
}
function fxBurst(x,y,z,color,n,speed,life,size){
  n=n||8;for(let i=0;i<n&&particles.length<240;i++){const m=new THREE.Mesh(geoBox,bas(color));m.position.set(x,y,z);scene.add(m);
    const a=rand(0,Math.PI*2),e=rand(-.2,1),s=(speed||6)*rand(.4,1);
    particles.push({m,vx:Math.cos(a)*s,vy:e*s,vz:Math.sin(a)*s,life:life||.5,max:life||.5,size:size||.22});}}
function fxRing(x,y,z,color,maxR,life){
  const m=ownMesh(geoRing,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9,side:THREE.DoubleSide}));
  m.rotation.x=-Math.PI/2;m.position.set(x,y+.08,z);
  addFx(life||.4,m,k=>{const s=Math.max(.01,maxR*k);m.scale.set(s,s,s);m.material.opacity=.9*(1-k);});}
function fxBeam(a,b,color,width,life){
  const d=new V3().subVectors(b,a),len=d.length();if(len<.01)return;
  const m=ownMesh(geoCyl,new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9}));
  m.position.copy(a).addScaledVector(d,.5);m.scale.set(width,len,width);
  m.quaternion.setFromUnitVectors(new V3(0,1,0),d.normalize());
  addFx(life||.2,m,k=>{m.material.opacity=.9*(1-k);m.scale.x=m.scale.z=width*(1-k*.6);});}
function fxSlash(f,o){
  const r=o.reach||3,arc=(o.arc||110)*Math.PI/180;
  const m=ownMesh(new THREE.RingGeometry(r*.45,r,20,1,(f.facing-Math.PI/2)-arc/2,arc),new THREE.MeshBasicMaterial({color:o.color||'#fff',transparent:true,opacity:.75,side:THREE.DoubleSide}));
  m.rotation.x=-Math.PI/2;m.position.set(f.x,f.y+1.2,f.z);
  addFx(.18,m,k=>{m.material.opacity=.75*(1-k);m.position.set(f.x,f.y+1.2,f.z);});}

function deltaWings(color,edge,scale){
  const g=new THREE.Group();
  [-1,1].forEach(s=>{
    const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(3.2,1.1);sh.lineTo(2.2,1.9);sh.lineTo(1.1,1.4);sh.lineTo(.2,2.5);sh.lineTo(0,0);
    const geo=new THREE.ShapeGeometry(sh);geo.rotateX(-Math.PI/2);
    const w=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color,side:THREE.DoubleSide}));
    w.scale.set(s*scale,1,scale);w.position.set(s*.45,2,-.35);
    const e=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:edge,wireframe:true}));e.scale.copy(w.scale);e.position.copy(w.position);
    g.add(w);g.add(e);});
  return g;}

function buildAvatar(look,weapon){

  if(look.emblem==='ring'){const t=new THREE.Mesh(new THREE.TorusGeometry(.24,.05,6,18),M(look.emblemColor));t.position.set(0,1.6,.34);g.add(t);mats.push(t.material);}
  else if(look.emblem==='diamond'){const d=mesh(geoBox,M(look.emblemColor),.3,.3,.04,0,1.6,.34,g);d.rotation.z=Math.PI/4;}
  const headY=2.65;

  const hc=look.hairColor;
  switch(look.hair){

      if(look.hair==='headband'){const b=new THREE.Mesh(new THREE.TorusGeometry(.52,.05,6,20),M(look.band));b.rotation.x=Math.PI/2;b.position.set(0,headY+.22,0);g.add(b);}break;}
    case 'spiky':for(let i=0;i<7;i++){const a=i/7*Math.PI*2,r=i?.28:0;const c=mesh(geoCone,M(hc),.16,.55,.16,Math.cos(a)*r,headY+.55,Math.sin(a)*r,g);c.rotation.z=-Math.cos(a)*(r?.5:0);c.rotation.x=Math.sin(a)*(r?.5:0);}break;
    case 'curly':for(let i=0;i<9;i++){const a=i/9*Math.PI*2;mesh(geoSph,M(hc),.2,.2,.2,Math.cos(a)*.33,headY+.4+(i%2)*.06,Math.sin(a)*.33,g);}mesh(geoSph,M(hc),.3,.25,.3,0,headY+.5,0,g);break;
    case 'cap':{const c=mesh(geoCap,M(hc),.55,.55,.55,0,headY+.04,0,g);mesh(geoBox,M(hc),.7,.06,.4,0,headY+.28,.5,g);break;}
    case 'straw':mesh(geoCyl,M(hc),1,.07,1,0,headY+.35,0,g);mesh(geoCyl,M(hc),.52,.3,.52,0,headY+.5,0,g);mesh(geoCyl,M('#e8334a'),.53,.08,.53,0,headY+.4,0,g);break;
    case 'horns':{const c=mesh(geoCap,M('#16161b'),.6,.6,.6,0,headY+.04,0,g);c.rotation.x=-.2;
      [-1,1].forEach(s=>{const h=mesh(geoCone,M('#e8334a'),.12,.6,.12,s*.4,headY+.55,0,g);h.rotation.z=-s*.5;});
      mesh(geoBox,new THREE.MeshBasicMaterial({color:'#ff2030'}),.7,.12,.05,0,headY+.07,.5,g);break;}
    case 'ring':{const t=new THREE.Mesh(new THREE.TorusGeometry(.3,.05,6,18),new THREE.MeshBasicMaterial({color:hc}));t.rotation.x=Math.PI/2-.3;t.position.set(0,headY+.45,0);g.add(t);}break;
  }
  const armL=new THREE.Group(),armR=new THREE.Group();armL.position.set(-.78,2.05,0);armR.position.set(.78,2.05,0);

  const wp=buildWeapon(weapon,armR,armL,look);

  g.scale.setScalar(.8);
  return{group:g,mats,parts:{legL,legR,armL,armR,head,wp,wings}};
}

function floorAt(f){let gy=0;for(const o of activeColliders()){
  if(f.x>o.minX-.3&&f.x<o.maxX+.3&&f.z>o.minZ-.3&&f.z<o.maxZ+.3&&f.y>=o.h-.35)gy=Math.max(gy,o.h);}return gy;}
function resolveCollisions(f){const r=f.radius;
  for(const o of activeColliders()){if(f.y>=o.h-.3)continue;
    const cx=clamp(f.x,o.minX,o.maxX),cz=clamp(f.z,o.minZ,o.maxZ),dx=f.x-cx,dz=f.z-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){if(d2>1e-6){const d=Math.sqrt(d2),p=r-d;f.x+=dx/d*p;f.z+=dz/d*p;}
      else{const l=f.x-o.minX,rr=o.maxX-f.x,t=f.z-o.minZ,b=o.maxZ-f.z,m=Math.min(l,rr,t,b);
        if(m===l)f.x=o.minX-r;else if(m===rr)f.x=o.maxX+r;else if(m===t)f.z=o.minZ-r;else f.z=o.maxZ+r;}}}}
function clampBounds(f){
  if(mode==='battle'){const A=CFG.ARENA;f.x=clamp(f.x,A.minX+1,A.maxX-1);f.z=clamp(f.z,A.minZ+1.5,A.maxZ-1.5);}
  else{const d=Math.hypot(f.x,f.z),m=CFG.LOBBY_R-1;if(d>m){f.x*=m/d;f.z*=m/d;}}}
function shove(f,dx,dz){f.x+=dx;f.z+=dz;resolveCollisions(f);clampBounds(f);}

const fighters=[];let uid=0,player=null;
function labelDraw(f){
  const c=f.labelCv.getContext('2d');c.clearRect(0,0,256,64);

  c.strokeText(f.def.name,128,22);c.fillText(f.def.name,128,22);
  c.fillStyle='#120b22';c.fillRect(30,34,196,18);
  const ally=player&&f.team===player.team;c.fillStyle=ally?'#3be07a':'#ff4d5e';
  c.fillRect(33,37,190*clamp(f.hp/f.maxHp,0,1),12);f.labelTex.needsUpdate=true;}
function buildVisual(f){
  const av=buildAvatar(f.def.look,f.def.weapon);f.group=av.group;f.mats=av.mats;f.parts=av.parts;scene.add(f.group);
  f.flightG=null;
  if(!f.deco){f.deco=new THREE.Group();scene.add(f.deco);
    mesh(geoDisc,new THREE.MeshBasicMaterial({color:'#000',transparent:true,opacity:.28}),.85,.85,1,0,0,0,f.deco).rotation.x=-Math.PI/2;
    const rg=mesh(geoRing,new THREE.MeshBasicMaterial({color:TEAMCOL[f.team],side:THREE.DoubleSide}),1.15,1.15,1,0,.02,0,f.deco);rg.rotation.x=-Math.PI/2;f.ring=rg;}
  if(f.label){f.group.remove(f.label);f.labelTex.dispose();}
  if(!f.isPlayer){
    f.labelCv=document.createElement('canvas');f.labelCv.width=256;f.labelCv.height=64;f.labelTex=new THREE.CanvasTexture(f.labelCv);
    f.label=new THREE.Sprite(new THREE.SpriteMaterial({map:f.labelTex,transparent:true,depthTest:false}));f.label.scale.set(5,1.25,1);f.label.position.set(0,4.2,0);f.group.add(f.label);labelDraw(f);}
}
function makeFighter(def,team,o){
  o=o||{};
  const f={id:++uid,def,team,isPlayer:!!o.isPlayer,isBot:!o.isPlayer,x:0,y:0,z:0,vx:0,vy:0,vz:0,kx:0,kz:0,
    hp:def.hp,maxHp:def.hp,alive:true,radius:.8,height:2.5,facing:team==='hero'?Math.PI:0,faceTo:null,
    cd:0,atkAnim:0,atkKind:'punch',combo:0,charge:0,stun:0,flash:0,flyT:0,flyKind:null,spinT:0,spinTick:0,spinAng:0,dashT:0,dashHit:null,
    forced:null,grounded:true,walkT:0,moveSpd:0,invuln:0,respawnT:0,life:o.life||0,follow:o.follow||null,summon:!!o.summon,superAnim:0,
    ai:{t:0,target:null,strafe:1,stuck:0,lx:0,lz:0,lt:0}};
  buildVisual(f);fighters.push(f);return f;}
function removeFighter(f){scene.remove(f.group);scene.remove(f.deco);disposeObj(f.group);
  const i=fighters.indexOf(f);if(i>=0)fighters.splice(i,1);}
function swapDef(f,def){detachFlight(f);scene.remove(f.group);f.def=def;f.hp=def.hp;f.maxHp=def.hp;buildVisual(f);f.ring.material.color.set(TEAMCOL[f.team]);}
function attachFlight(f,kind){detachFlight(f);const g=new THREE.Group();f.group.add(g);f.flightG=g;
  if(kind==='jetpack'){[-1,1].forEach(s=>{mesh(geoCyl,lam('#8892a0'),.2,.8,.2,.32*s,1.7,-.5,g);
    const fl=mesh(geoCone,bas('#ffb02e'),.17,.6,.17,.32*s,1.05,-.5,g);fl.rotation.x=Math.PI;fl.userData.flame=true;});}
  else{g.add(deltaWings('#16161b','#f5c518',1.15));if(f.parts.wings)f.parts.wings.visible=false;}}
function detachFlight(f){if(f.flightG){f.group.remove(f.flightG);disposeObj(f.flightG);f.flightG=null;}if(f.parts&&f.parts.wings)f.parts.wings.visible=true;}

function stepFighter(f,dt,mx,mz,jump,vyFly){
  if(!f.alive)return;
  f.stun=Math.max(0,f.stun-dt);f.invuln=Math.max(0,f.invuln-dt);f.cd=Math.max(0,f.cd-dt);f.atkAnim=Math.max(0,f.atkAnim-dt);f.superAnim=Math.max(0,f.superAnim-dt);
  if(f.stun>0){mx=mz=0;jump=false;}
  let dx=0,dz=0;
  if(f.forced){const t=f.forced.to;const ddx=t.x-f.x,ddz=t.z-f.z,d=Math.hypot(ddx,ddz);f.forced.t-=dt;
    if(d>f.forced.stop&&f.forced.t>0){dx=ddx/d*f.forced.speed*dt;dz=ddz/d*f.forced.speed*dt;}else f.forced=null;}
  else if(f.dashT>0){f.dashT-=dt;dx=f.dashDX*dt;dz=f.dashDZ*dt;
    for(const e of fighters){if(!e.alive||e.team===f.team||f.dashHit.has(e))continue;
      if(Math.hypot(e.x-f.x,e.z-f.z)<2.2){f.dashHit.add(e);damage(e,f.dashDmg,f,{kx:f.dashDX*.5,kz:f.dashDZ*.5,stun:.5});fxBurst(e.x,e.y+1.3,e.z,'#fff',10,8,.4,.3);}}
    if(f.dashT<=0)f.dashHit=null;}
  else{const spd=f.def.speed*(f.spinT>0?.8:1)*(f.flyT>0?1.5:1);dx=mx*spd*dt;dz=mz*spd*dt;}
  f.moveSpd=dt>0?Math.hypot(dx,dz)/dt:0;
  dx+=f.kx*dt;dz+=f.kz*dt;const kd=Math.max(0,1-8*dt);f.kx*=kd;f.kz*=kd;
  f.x+=dx;f.z+=dz;resolveCollisions(f);clampBounds(f);
  if(f.flyT>0){f.flyT-=dt;f.vy=lerp(f.vy,vyFly||0,Math.min(1,6*dt));if(f.flyT<=0){f.flyT=0;detachFlight(f);}}
  else{f.vy-=CFG.GRAVITY*dt;if(jump&&f.grounded){f.vy=CFG.JUMP_V;f.grounded=false;}}
  f.y=Math.min(f.y+f.vy*dt,48);
  const gy=floorAt(f);if(f.y<=gy){f.y=gy;if(f.vy<0)f.vy=0;f.grounded=true;}else f.grounded=false;
  if(f.spinT>0){f.spinT-=dt;f.spinAng+=dt*20;f.spinTick-=dt;
    if(f.spinTick<=0){f.spinTick=.2;const S=f.def.superDef;fxRing(f.x,f.y+.5,f.z,'#5ef0ff',S.r,.25);
      for(const e of fighters){if(!e.alive||e.team===f.team)continue;const d=Math.hypot(e.x-f.x,e.z-f.z);
        if(d<S.r+e.radius&&Math.abs(e.y-f.y)<3){damage(e,S.dmg,f,{kx:(e.x-f.x)/(d||1)*10,kz:(e.z-f.z)/(d||1)*10,stun:.1});}}}
    if(f.spinT<=0)f.spinAng=0;}
  if(f.life>0){f.life-=dt;if(f.life<=0)kill(f,null,true);}
}

function animateFighter(f,dt,t){
  const p=f.parts,g=f.group;
  if(!f.alive){g.visible=false;f.deco.visible=false;return;}
  g.visible=true;f.deco.visible=true;
  if(f.invuln>0)g.visible=Math.floor(t*14)%2===0;
  /* facing */
  let want=f.faceTo;
  if(want==null&&f.moveSpd>.5&&f.mvx!==undefined)want=Math.atan2(f.mvx,f.mvz);
  if(want!=null&&f.stun<=0){f.facing+=clamp(angDiff(f.facing,want),-16*dt,16*dt);}
  g.position.set(f.x,f.y,f.z);g.rotation.y=f.facing+f.spinAng;
  g.rotation.x=f.dashT>0?1.2:(f.flyT>0?.55:0);
  f.walkT+=f.moveSpd*dt*.9;const sw=Math.sin(f.walkT)*clamp(f.moveSpd/8,0,1)*.9;
  if(f.grounded){p.legL.rotation.x=sw;p.legR.rotation.x=-sw;}else{p.legL.rotation.x=.5;p.legR.rotation.x=-.3;}
  const w=f.def.weapon,a=f.atkAnim/.28,s=1-a,ranged=RANGED_W.includes(w),melee=MELEE_W.includes(w);
  if(ranged){p.armR.rotation.x=-1.45+(f.atkAnim>0?.35*a:0);p.armL.rotation.x=-sw*.6;}
  else if(melee){p.armL.rotation.x=-sw*.6;p.armR.rotation.x=f.atkAnim>0?lerp(-2.4,.2,s):-.6+Math.sin(t*2)*.04;}
  else{p.armL.rotation.x=-.7;p.armR.rotation.x=-.7;
    if(f.atkAnim>0){const arm=f.combo%2?p.armR:p.armL;if(f.atkKind==='kick')p.legR.rotation.x=-1.4*Math.sin(s*Math.PI);else arm.rotation.x=-1.55*Math.sin(s*Math.PI)-.7;}}
  if(f.dashT>0){p.legR.rotation.x=-1.2;p.legL.rotation.x=.4;}
  if(f.flyT>0&&f.flightG){f.flightG.traverse(n=>{if(n.userData.flame)n.scale.y=.5+Math.random()*.4;});}
  if(f.flash>0){f.flash-=dt;const k=f.flash>0?.7:0;f.mats.forEach(m=>m.emissive.setRGB(k,k*.15,k*.15));}
  const gy=floorAt({x:f.x,z:f.z,y:99});
  f.deco.position.set(f.x,gy+.04,f.z);
  if(f.label&&f.labelDirty){f.labelDirty=false;labelDraw(f);}
}

const fw=f=>({x:Math.sin(f.facing),z:Math.cos(f.facing)});
function hz(d,f){const l=Math.hypot(d.x,d.z);return l>1e-4?{x:d.x/l,z:d.z/l}:fw(f);}
function muzzle(f,d){return new V3(f.x+d.x*1,f.y+1.7+d.y*.6,f.z+d.z*1);}
function addCharge(f,n){f.charge=Math.min(100,f.charge+n);if(f.isPlayer)HUD.refreshSuper();}

function damage(t,amount,src,o){
  o=o||{};if(!t.alive||t.invuln>0)return;
  if(src&&src.isBot)amount*=CFG.BOT_DMG;
  t.hp-=amount;t.flash=.12;t.labelDirty=true;
  if(o.kx||o.kz){t.kx+=o.kx||0;t.kz+=o.kz||0;}
  if(o.stun)t.stun=Math.max(t.stun,o.stun);
  if(src&&src===player&&o.light){addCharge(src,CFG.CHARGE_PER_HIT);Missions.event('hit');}
  if(t===player){HUD.hurt();HUD.refreshHP();}
  if(t.hp<=0)kill(t,src,false);
}
function kill(t,src,silent){
  if(!t.alive)return;t.alive=false;t.hp=0;t.labelDirty=true;
  fxBurst(t.x,t.y+1.3,t.z,TEAMCOL[t.team],16,9,.7,.35);fxRing(t.x,t.y,t.z,TEAMCOL[t.team],4,.5);
  detachFlight(t);t.flyT=0;t.spinT=0;t.dashT=0;t.forced=null;
  if(t.summon){schedule(.05,()=>removeFighter(t));return;}
  if(!silent&&src){score[src.team]++;HUD.refreshScore();
    if(src===player){Eco.addCoins(CFG.KILL_COINS);Save.d.kills++;HUD.toast('+'+CFG.KILL_COINS+' 🪙');Missions.event('kill');}}
  if(t===player){t.respawnT=CFG.PLAYER_RESPAWN;$('dead').hidden=false;HUD.refreshHP();}
  else t.respawnT=CFG.BOT_RESPAWN;
}
function spawnPoint(team,i){const A=CFG.ARENA;return{x:rand(-18,18),z:team==='hero'?A.maxZ-6-rand(0,3):A.minZ+6+rand(0,3)};}
function respawn(f){const p=spawnPoint(f.team);f.x=p.x;f.z=p.z;f.y=0;f.vy=0;f.hp=f.maxHp;f.alive=true;f.stun=0;f.invuln=1.5;f.forced=null;f.labelDirty=true;
  f.facing=f.team==='hero'?Math.PI:0;
  if(f===player){$('dead').hidden=true;cam.yaw=f.team==='hero'?Math.PI:0;HUD.refreshHP();}}

/* projéteis */
function spawnProj(o){
  const shape=o.shape||'ball';let m;
  if(o.glow){m=new THREE.Group();m.add(new THREE.Mesh(geoSph,bas(o.color)));const h=new THREE.Mesh(geoSph,bas('#ffffff',.35));h.scale.setScalar(1.35);m.add(h);m.scale.setScalar(o.size);}
  else if(shape==='arrow'){m=new THREE.Mesh(geoBox,bas(o.color));m.scale.set(o.size*.5,o.size*.5,1.3);}
  else if(shape==='cube'){m=new THREE.Mesh(geoBox,bas(o.color));m.scale.setScalar(o.size*1.3);}
  else{m=new THREE.Mesh(geoSph,bas(o.color));m.scale.setScalar(o.size);}
  m.position.copy(o.pos);scene.add(m);
  projectiles.push({owner:o.f,team:o.f.team,pos:o.pos.clone(),vel:o.vel,dmg:o.dmg,r:o.r!==undefined?o.r:o.size*.9+.15,life:o.life,grav:o.grav||0,
    pierce:!!o.pierce,pierceWalls:!!o.pierceWalls,noGround:!!o.noGround,splash:o.splash||0,splashDmg:o.splashDmg||0,light:!!o.light,shock:o.shock||0,knock:o.knock||2,
    hit:new Set(),mesh:m,shape,onHit:o.onHit,onEnd:o.onEnd,color:o.color,glow:!!o.glow});
}
function endProj(p,why){
  if(p.splash>0){fxRing(p.pos.x,Math.max(0,p.pos.y-.5),p.pos.z,p.color,p.splash,.35);fxBurst(p.pos.x,p.pos.y,p.pos.z,p.color,12,9,.5,.3);
    for(const e of fighters){if(!e.alive||e.team===p.team||p.hit.has(e))continue;
      const dx=e.x-p.pos.x,dz=e.z-p.pos.z,d=Math.hypot(dx,dz);
      if(d<p.splash+e.radius&&Math.abs(e.y+1.2-p.pos.y)<p.splash+1.5)damage(e,p.splashDmg||p.dmg*.6,p.owner,{light:p.light,kx:dx/(d||1)*7,kz:dz/(d||1)*7});}}
  else fxBurst(p.pos.x,p.pos.y,p.pos.z,p.color,5,5,.3,.18);
  if(p.onEnd)p.onEnd(p,why);
  scene.remove(p.mesh);
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];
    p.life-=dt;if(p.grav)p.vel.y-=p.grav*dt;
    const steps=Math.max(1,Math.ceil(p.vel.length()*dt/.9)),sx=p.vel.x*dt/steps,sy=p.vel.y*dt/steps,sz=p.vel.z*dt/steps;
    let dead=null;
    for(let s=0;s<steps&&!dead;s++){
      p.pos.x+=sx;p.pos.y+=sy;p.pos.z+=sz;
      if(!p.noGround&&p.pos.y<=.1){dead='ground';break;}
      if(!p.pierceWalls){for(const o of activeColliders()){if(p.pos.x>o.minX&&p.pos.x<o.maxX&&p.pos.z>o.minZ&&p.pos.z<o.maxZ&&p.pos.y<o.h){dead='wall';break;}}if(dead)break;}
      for(const e of fighters){if(!e.alive||e.team===p.team||p.hit.has(e)||e.invuln>0)continue;
        const dx=e.x-p.pos.x,dz=e.z-p.pos.z,rr=p.r+e.radius;
        if(dx*dx+dz*dz<rr*rr&&p.pos.y>e.y-.3&&p.pos.y<e.y+e.height+.3){
          const d=Math.hypot(dx,dz)||1;p.hit.add(e);
          damage(e,p.dmg,p.owner,{light:p.light,kx:-dx/d*p.knock*2,kz:-dz/d*p.knock*2,stun:p.shock});
          fxBurst(p.pos.x,p.pos.y,p.pos.z,p.color,6,6,.3,.2);
          if(p.onHit)p.onHit(p,e);
          if(!p.pierce){dead='hit';break;}}}
    }
    if(!dead&&p.life<=0)dead='life';
    if(p.glow&&Math.random()<.5)fxBurst(p.pos.x,p.pos.y,p.pos.z,p.color,1,2,.4,.35);
    p.mesh.position.copy(p.pos);
    if(p.shape==='arrow')p.mesh.lookAt(p.pos.x+p.vel.x,p.pos.y+p.vel.y,p.pos.z+p.vel.z);
    if(p.shape==='cube'){p.mesh.rotation.x+=dt*8;p.mesh.rotation.y+=dt*6;}
    if(dead){endProj(p,dead);projectiles.splice(i,1);}
  }
}

/* zonas (tornado, bola atmosférica) */
function updateZones(dt){
  for(let i=zones.length-1;i>=0;i--){const z=zones[i];z.life-=dt;z.tickT-=dt;
    if(z.update)z.update(z,dt);
    if(z.tickT<=0){z.tickT=z.tick;z.onTick(z);}
    if(z.mesh){z.mesh.position.set(z.x,0,z.z);z.mesh.rotation.y+=dt*6;}
    if(z.life<=0){scene.remove(z.mesh);disposeObj(z.mesh);zones.splice(i,1);}}}
function pullEnemies(z,speed,dt,lift){
  for(const e of fighters){if(!e.alive||e.team===z.team)continue;const dx=z.x-e.x,dz=z.z-e.z,d=Math.hypot(dx,dz);
    if(d<z.r+e.radius&&d>.4)shove(e,dx/d*speed*dt,dz/d*speed*dt);}}

/* ataques leves */
function meleeHit(f,o){
  fxSlash(f,o);let n=0;
  if(o.whip){const d=fw(f);fxBeam(new V3(f.x,f.y+1.6,f.z),new V3(f.x+d.x*o.reach,f.y+1.2,f.z+d.z*o.reach),'#ffffff',.06,.15);}
  for(const e of fighters){if(!e.alive||e.team===f.team||e.invuln>0)continue;
    const dx=e.x-f.x,dz=e.z-f.z,d=Math.hypot(dx,dz);
    if(d>o.reach+e.radius||Math.abs(e.y-f.y)>3.5)continue;
    if(d>1.2&&Math.abs(angDiff(f.facing,Math.atan2(dx,dz)))>o.arc*Math.PI/360)continue;
    damage(e,o.dmg,f,{light:o.light,kx:dx/(d||1)*o.knock*3,kz:dz/(d||1)*o.knock*3});n++;
    fxBurst(e.x,e.y+1.3,e.z,o.elec?'#c77dff':o.color||'#fff',o.elec?10:6,7,.3,.22);
    if(o.elec)fxBeam(new V3(f.x,f.y+1.4,f.z),new V3(e.x,e.y+1.3,e.z),'#c77dff',.08,.12);}
  return n;}
const LIGHT={
  shoot(f,L,aim){
    const n=L.count||1;
    for(let i=0;i<n;i++){const d=aim.dir.clone();
      if(L.spread){d.x+=rand(-1,1)*L.spread;d.z+=rand(-1,1)*L.spread;d.y+=rand(-.5,.5)*L.spread*.5;d.normalize();}
      spawnProj({f,pos:muzzle(f,d),vel:d.clone().multiplyScalar(L.speed),dmg:L.dmg,size:L.size,color:L.color,life:L.range/L.speed,grav:L.grav||0,
        splash:L.splash||0,splashDmg:L.splashDmg||0,light:true,shape:L.shape,shock:L.shock||0});}
    fxBurst(f.x+aim.dir.x,f.y+1.7,f.z+aim.dir.z,L.color,3,4,.2,.15);
    return L.cd;},
  melee(f,L,aim){
    f.combo=(f.combo+1)%2;let dmg=L.dmg,reach=L.reach,kick=false;
    if(L.alt&&f.combo===1){dmg=L.alt.dmg;reach=L.alt.reach;kick=!!L.alt.kick;}
    f.atkKind=kick?'kick':'punch';
    const hit=()=>{if(f.alive)meleeHit(f,{dmg,reach,arc:L.arc,knock:L.knock||2.5,color:L.color,whip:L.whip,elec:L.elec,light:true});};
    hit();if(L.hits>1)schedule(.12,()=>{f.atkAnim=.28;hit();});
    return L.cd;},
  dual(f,L,aim){
    const d=aim.target?Math.hypot(aim.target.x-f.x,aim.target.z-f.z):99;
    if(d<=L.switchDist)return LIGHT.melee(f,Object.assign({arc:L.melee.arc},L.melee),aim);
    const B=L.bomb,h=hz(aim.dir,f),dist=aim.target?d:22,t=clamp(dist/B.speed,.35,1.4),vy=(1.2-1.7+.5*B.grav*t*t)/t;
    const hv=dist/t;
    spawnProj({f,pos:muzzle(f,new V3(h.x,0,h.z)),vel:new V3(h.x*hv,vy,h.z*hv),dmg:B.dmg,size:B.size,color:B.color,life:3,grav:B.grav,splash:B.splash,splashDmg:B.splashDmg,light:true});
    return B.cd;}
};
function tryLight(f,aim){
  if(!f.alive||f.cd>0||f.stun>0||f.forced||f.dashT>0)return false;
  f.facing=Math.atan2(aim.dir.x,aim.dir.z);f.faceTo=null;
  const cd=LIGHT[f.def.light.kind](f,f.def.light,aim);f.cd=cd*(f.isPlayer?1:1.5);f.atkAnim=.28;return true;}

/* auto-mira */
function findTarget(f,range,coneDeg,base){
  let best=null,bs=1e9;const ba=Math.atan2(base.x,base.z);
  for(const e of fighters){if(!e.alive||e.team===f.team||e.invuln>0)continue;
    const dx=e.x-f.x,dz=e.z-f.z,d=Math.hypot(dx,dz);if(d>range)continue;
    const ang=Math.abs(angDiff(ba,Math.atan2(dx,dz)));if(ang>coneDeg*Math.PI/180)continue;
    const s=d+ang*6;if(s<bs){bs=s;best=e;}}
  return best;}
function aimAt(f,t,base){
  if(t)return{dir:new V3(t.x-f.x,(t.y+1.2)-(f.y+1.6),t.z-f.z).normalize(),target:t};
  return{dir:new V3(base.x,0,base.z),target:null};}
function playerAim(f,range){
  const base={x:Math.sin(cam.yaw),z:Math.cos(cam.yaw)};
  let t=findTarget(f,range,75,base);if(!t)t=findTarget(f,Math.min(range,7),180,base);
  return aimAt(f,t,base);}

function useSuper(f,aim){
  if(!f.alive||f.charge<100||f.stun>0||f.forced)return;
  const S=f.def.superDef;if(!SUPERS[S.kind])return;
  aim=aim||(f.isPlayer?playerAim(f,60):null);if(!aim)return;
  f.facing=Math.atan2(aim.dir.x,aim.dir.z);f.faceTo=null;
  if(SUPERS[S.kind](f,S,aim)===false)return;
  f.charge=0;f.superAnim=.5;
  if(f.isPlayer){Missions.event('super');HUD.refreshSuper();HUD.toast(S.name+'!');}}

/* ---------- 8. IA ---------- */
function lineBlocked(x1,z1,x2,z2,y){
  if(mode!=='battle')return false;
  for(let k=1;k<10;k++){const t=k/10,x=lerp(x1,x2,t),z=lerp(z1,z2,t);
    for(const o of battleColliders){if(x>o.minX&&x<o.maxX&&z>o.minZ&&z<o.maxZ&&y<o.h)return true;}}
  return false;}
function botThink(f,dt){
  const ai=f.ai,L=f.def.light;ai.t-=dt;
  if(ai.t<=0){ai.t=rand(.3,.6);ai.target=findTarget(f,95,180,{x:0,z:1});if(Math.random()<.35)ai.strafe*=-1;}
  const tg=ai.target&&ai.target.alive?ai.target:null;
  let mx=0,mz=0,jump=false;f.faceTo=null;
  const range=L.kind==='shoot'?L.range*.55:L.kind==='dual'?12:(L.reach||3)*.8;
  const reachAtk=L.kind==='shoot'?L.range:L.kind==='dual'?18:(L.reach||3)+.8;
  if(tg){
    const dx=tg.x-f.x,dz=tg.z-f.z,d=Math.hypot(dx,dz)||1,ux=dx/d,uz=dz/d;
    const blocked=lineBlocked(f.x,f.z,tg.x,tg.z,1.6);
    if(blocked){mx=ux*.5-uz*ai.strafe*.8;mz=uz*.5+ux*ai.strafe*.8;}
    else if(d>range){mx=ux;mz=uz;}
    else if(d<range*.45&&L.kind==='shoot'){mx=-ux;mz=-uz;}
    else{mx=-uz*ai.strafe*.6;mz=ux*ai.strafe*.6;}
    f.faceTo=Math.atan2(ux,uz);
    if(!blocked&&d<=reachAtk&&f.cd<=0&&f.stun<=0&&Math.random()<.9){
      const base={x:ux,z:uz};const a=aimAt(f,tg,base);a.dir.x+=rand(-.05,.05);a.dir.z+=rand(-.05,.05);a.dir.normalize();tryLight(f,a);}
  }else if(f.follow&&f.follow.alive){
    const dx=f.follow.x-f.x,dz=f.follow.z-f.z,d=Math.hypot(dx,dz);if(d>6){mx=dx/d;mz=dz/d;}
  }else{
    const A=CFG.ARENA,gz=f.team==='hero'?A.minZ+25:A.maxZ-25,dx=0-f.x,dz=gz-f.z,d=Math.hypot(dx,dz)||1;mx=dx/d*.7;mz=dz/d;
  }
  ai.lt-=dt;if(ai.lt<=0){ai.lt=.6;const moved=Math.hypot(f.x-ai.lx,f.z-ai.lz);
    if((mx||mz)&&moved<.8){jump=true;ai.strafe*=-1;ai.stuck=.5;}ai.lx=f.x;ai.lz=f.z;}
  if(ai.stuck>0){ai.stuck-=dt;jump=true;}
  const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l;}
  f.mvx=mx;f.mvz=mz;
  stepFighter(f,dt,mx,mz,jump,0);
}

function inputDir(){
  let jx=Joy.x,jy=Joy.y;
  if(Math.hypot(jx,jy)<.12){jx=0;jy=0;}
  if(Keys.KeyA||Keys.ArrowLeft)jx-=1;if(Keys.KeyD||Keys.ArrowRight)jx+=1;if(Keys.KeyW||Keys.ArrowUp)jy+=1;if(Keys.KeyS||Keys.ArrowDown)jy-=1;
  const len=Math.hypot(jx,jy);if(len>1){jx/=len;jy/=len;}
  const s=Math.sin(cam.yaw),c=Math.cos(cam.yaw);
  return{x:s*jy-c*jx,z:c*jy+s*jx,jy,mag:Math.min(1,len)};}
function updateCamera(dt){
  const p=player,tx=p.x,ty=p.y+2,tz=p.z,d=cam.dist,cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  let cx=tx-Math.sin(cam.yaw)*cp*d,cy=Math.max(ty+sp*d,.6),cz=tz-Math.cos(cam.yaw)*cp*d;
  if(shake>0){shake=Math.max(0,shake-dt*1.6);cx+=rand(-1,1)*shake;cy+=rand(-1,1)*shake;}
  camera.position.set(cx,cy,cz);camera.lookAt(tx,ty+.2,tz);}

function portrait(cv,def){
  const c=cv.getContext('2d'),w=cv.width,h=cv.height,L=def.look;
  const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,def.team==='hero'?'#2b7a52':'#52308a');g.addColorStop(1,'#1b1230');c.fillStyle=g;c.fillRect(0,0,w,h);
  c.lineWidth=3;c.strokeStyle='#0b0814';c.lineJoin='round';c.lineCap='round';
  const R=(x,y,ww,hh,col)=>{c.fillStyle=col;c.fillRect(x,y,ww,hh);c.strokeRect(x,y,ww,hh);};
  R(35,82,12,22,L.pants);R(50,82,12,22,L.pants);R(33,102,15,7,L.shoes||L.pants);R(49,102,15,7,L.shoes||L.pants);
  R(23,56,9,26,L.shirt);R(65,56,9,26,L.shirt);

  if(L.emblem==='diamond'){c.fillStyle=L.emblemColor;c.beginPath();c.moveTo(48,60);c.lineTo(55,68);c.lineTo(48,76);c.lineTo(41,68);c.fill();}
  c.fillStyle=L.hand||L.skin;c.beginPath();c.arc(27,84,5,0,7);c.fill();c.stroke();c.beginPath();c.arc(70,84,5,0,7);c.fill();c.stroke();
  c.fillStyle=L.skin;c.beginPath();c.arc(48,34,22,0,7);c.fill();c.stroke();
  const hc=L.hairColor;c.fillStyle=hc||'#000';
  if(L.hair==='flat'||L.hair==='headband'||L.hair==='cap'||L.hair==='horns'){c.fillStyle=L.hair==='horns'?'#16161b':hc;c.beginPath();c.arc(48,32,23,Math.PI,0);c.closePath();c.fill();c.stroke();}

  if(L.hair==='spiky'){c.fillStyle=hc;for(let i=0;i<5;i++){c.beginPath();c.moveTo(28+i*10,16);c.lineTo(33+i*10,4);c.lineTo(38+i*10,16);c.fill();c.stroke();}}
  if(L.hair==='curly'){c.fillStyle=hc;for(let i=0;i<6;i++){c.beginPath();c.arc(30+i*7.5,14+(i%2)*3,7,0,7);c.fill();}}
  if(L.hair==='straw'){c.fillStyle=hc;c.beginPath();c.ellipse(48,18,34,7,0,0,7);c.fill();c.stroke();c.fillRect(35,4,26,15);c.strokeRect(35,4,26,15);}
  if(L.hair==='ring'){c.strokeStyle=hc;c.beginPath();c.ellipse(48,10,12,6,0,0,7);c.stroke();c.strokeStyle='#0b0814';}
  c.strokeStyle=L.redEyes?'#ff2030':'#0b0814';c.lineWidth=3;c.beginPath();c.moveTo(40,28);c.lineTo(40,40);c.moveTo(56,28);c.lineTo(56,40);c.stroke();
  c.strokeStyle='#0b0814';c.beginPath();c.moveTo(42,46);c.lineTo(54,46);c.stroke();
  if(L.glasses){c.lineWidth=2;c.beginPath();c.arc(40,35,7,0,7);c.stroke();c.beginPath();c.arc(56,35,7,0,7);c.stroke();}

}

function updatePlayer(dt){
  const f=player;
  if(!f.alive){f.respawnT-=dt;if(f.respawnT<=0&&mode==='battle')respawn(f);return;}
  const can=!uiOpen;
  const dir=can?inputDir():{x:0,z:0,jy:0,mag:0};
  f.mvx=dir.x;f.mvz=dir.z;
  let vyFly=0;
  if(f.flyT>0){vyFly=-Math.sin(cam.pitch-.3)*14*dir.jy+(can&&Input.jump?8:0)-(can&&(Keys.ShiftLeft||Keys.KeyC)?8:0);}
  const aimRange=f.def.light.range||9;
  if(can&&Input.atk&&f.cd<=0)tryLight(f,playerAim(f,aimRange));
  if(Input.superQ){Input.superQ=false;if(can)useSuper(f);}
  f.faceTo=null;
  stepFighter(f,dt,dir.x,dir.z,can&&Input.jump,vyFly);
  if(mode==='lobby'&&can){
    nearI=null;let bd=1e9;
    for(const it of interactables){const d=Math.hypot(f.x-it.x,f.z-it.z);if(d<it.r&&d<bd){bd=d;nearI=it;}}
    if(Input.useQ&&nearI)nearI.action();
    if(Math.hypot(f.x-0,f.z+19)<3.4)enterBattle();
  }else nearI=null;
  Input.useQ=false;
  const b=$('btnUse');if(nearI&&!uiOpen){b.hidden=false;if(b.dataset.l!==nearI.label){b.dataset.l=nearI.label;b.textContent='E · '+nearI.label;}}else b.hidden=true;
}
let last=performance.now(),clock=0,hudAcc=0;
function update(dt){
  clock+=dt;
  updatePlayer(dt);
  for(const f of fighters.slice()){
    if(f===player)continue;
    if(f.alive){botThink(f,dt);}
    else if(f.respawnT>0&&mode==='battle'){f.respawnT-=dt;if(f.respawnT<=0)respawn(f);}
  }
  updateProjectiles(dt);updateZones(dt);updateFx(dt);
  for(const f of fighters)animateFighter(f,dt,clock);
  lobby.portalRings.forEach((r,i)=>{r.rotation.z+=dt*(i?-2:1.2);});
  lobby.totemTop.rotation.y+=dt*1.5;lobby.totemTop.position.y=7.8+Math.sin(clock*2)*.25;
  lobby.display.rotation.y+=dt*.8;
  updateCamera(dt);
  hudAcc+=dt;if(hudAcc>.1){hudAcc=0;HUD.refreshSuper();
    if(HUD.hintT>0){HUD.hintT-=.1;if(HUD.hintT<=0)$('hint').style.opacity=0;}}
}
function frame(now){

  try{update(dt);}catch(err){console.error(err);}
  renderer.render(scene,camera);requestAnimationFrame(frame);}
